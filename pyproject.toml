[project]
name = "clerk"
version = "0.1.0"
description = "clerk is that front-desk lady at any organization, but my clerk is a local RAG that I built from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8.16",
    "tqdm>=4.70.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "ollama>=0.6.3",
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.4",
]
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
